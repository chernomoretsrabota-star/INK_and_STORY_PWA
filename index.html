<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#211d2a"><meta name="description" content="Личная писательская мастерская">
<link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon.svg">
<title>INK & STORY — писательская мастерская</title>
<style>
:root{--bg:#17151d;--panel:#211e29;--panel2:#292532;--line:#3b3545;--text:#f3eef5;--muted:#aaa1b2;--accent:#c5a4df;--accent2:#8f72ad;--paper:#f5f0e8;--ink:#302b33;--good:#9bc6a5;--danger:#d58e94;--shadow:0 14px 40px #0005}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 system-ui,-apple-system,Segoe UI,sans-serif}button,input,textarea,select{font:inherit}button{cursor:pointer;border:1px solid var(--line);border-radius:11px;padding:9px 13px;background:var(--panel2);color:var(--text)}button.primary{background:var(--accent);color:#211927;border-color:var(--accent);font-weight:700}button.ghost{background:transparent}button.danger{color:var(--danger)}button:active{transform:translateY(1px)}input,textarea,select{background:#17151d;color:var(--text);border:1px solid var(--line);border-radius:10px;padding:10px;width:100%;outline:none}input:focus,textarea:focus,select:focus{border-color:var(--accent)}textarea{resize:vertical;min-height:90px}.app{min-height:100dvh;display:grid;grid-template-columns:250px 1fr}.sidebar{background:#1e1b25;border-right:1px solid var(--line);padding:18px 14px;display:flex;flex-direction:column;gap:14px}.brand{font-family:Georgia,serif;font-size:22px;letter-spacing:1px;color:var(--accent);padding:4px 8px}.brand small{display:block;font:10px system-ui;letter-spacing:3px;color:var(--muted)}.nav{display:grid;gap:5px}.nav button{text-align:left;background:transparent;border-color:transparent}.nav button.active,.nav button:hover{background:var(--panel2);border-color:var(--line)}.project-list{display:grid;gap:5px}.project-item{display:flex;align-items:center;gap:8px;text-align:left;width:100%;overflow:hidden}.project-item span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.side-bottom{margin-top:auto;display:grid;gap:8px}.main{min-width:0;padding:22px clamp(14px,3vw,38px) 60px}.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:22px}.topbar h1{font:26px Georgia,serif;margin:0}.actions{display:flex;gap:7px;flex-wrap:wrap}.page{max-width:1120px;margin:auto}.muted{color:var(--muted)}.grid{display:grid;grid-template-columns:repeat(12,1fr);gap:14px}.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:17px;box-shadow:var(--shadow);min-width:0}.card h2,.card h3{font-family:Georgia,serif;font-weight:500;margin:0 0 12px}.card h2{font-size:21px}.card h3{font-size:17px}.cover{width:100%;aspect-ratio:3/4;object-fit:cover;border-radius:12px;background:linear-gradient(145deg,#54435f,#17151d);display:block}.cover-placeholder{aspect-ratio:3/4;border:1px dashed var(--line);border-radius:12px;display:grid;place-items:center;color:var(--muted);text-align:center;padding:14px}.field{display:grid;gap:6px;margin:0 0 12px}.field label{font-size:12px;color:var(--muted);letter-spacing:.3px}.stats{display:flex;gap:12px;flex-wrap:wrap}.stat{background:var(--panel2);padding:10px 13px;border-radius:12px;min-width:105px}.stat b{display:block;font-size:20px;color:var(--accent)}.stat small{color:var(--muted)}.editor-wrap{background:var(--paper);color:var(--ink);border-radius:15px;overflow:hidden;box-shadow:var(--shadow)}.editor-toolbar{background:#e9e0d5;padding:8px;display:flex;gap:5px;flex-wrap:wrap;border-bottom:1px solid #d4c9bd}.editor-toolbar button{background:#f6f0e9;color:#3c3540;border-color:#d7cbbf;padding:6px 10px}.editor{min-height:55vh;padding:clamp(20px,5vw,55px);font:18px/1.85 Georgia,serif;outline:none;overflow-wrap:anywhere}.editor:empty:before{content:"Здесь начинается твоя история…";color:#a59a91}.editor h1,.editor h2{line-height:1.2}.editor img{max-width:100%;height:auto;border-radius:8px}.editor blockquote{border-left:3px solid #9b7bb2;margin:18px 0;padding:8px 18px;color:#685d6a;background:#eee6ed}.editor hr{border:0;border-top:1px solid #cfc3b8;margin:25px 0}.chapter-row,.note-row,.character-row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:11px 0;border-bottom:1px solid var(--line)}.chapter-row:last-child,.note-row:last-child{border:0}.pill{font-size:11px;border:1px solid var(--line);border-radius:30px;padding:3px 8px;color:var(--muted)}.empty{padding:30px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:14px}.toolbar-spacer{flex:1}.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#332c3c;border:1px solid var(--line);border-radius:30px;padding:10px 16px;box-shadow:var(--shadow);z-index:10;display:none}.toast.show{display:block}.mobile-menu{display:none}.small{font-size:12px}.cover-row{display:grid;grid-template-columns:150px 1fr;gap:18px;align-items:start}.hidden{display:none!important}.tag{display:inline-block;background:#393044;border-radius:7px;padding:3px 8px;margin:3px;font-size:12px}.modal-back{position:fixed;inset:0;background:#0009;display:grid;place-items:center;padding:15px;z-index:20}.modal{background:var(--panel);border:1px solid var(--line);border-radius:17px;padding:20px;width:min(520px,100%);max-height:90dvh;overflow:auto}.modal h2{font:22px Georgia;margin-top:0}
@media(max-width:760px){.app{display:block}.sidebar{position:fixed;z-index:15;inset:0 auto 0 0;width:min(285px,85vw);transform:translateX(-105%);transition:.2s;box-shadow:var(--shadow)}.sidebar.open{transform:translateX(0)}.main{padding:14px 13px 45px}.mobile-menu{display:inline-flex}.topbar h1{font-size:21px}.cover-row{grid-template-columns:105px 1fr;gap:12px}.card{padding:13px}.editor{min-height:58vh;padding:22px 18px;font-size:17px}.stats{gap:7px}.stat{min-width:90px;padding:8px}.grid{gap:9px}}
</style></head>
<body>
<div class="app">
<aside class="sidebar" id="sidebar">
<div class="brand">INK & STORY<small>WRITER'S STUDIO</small></div>
<button class="primary" id="newProject">＋ Новый проект</button>
<div class="muted small">РАБОЧЕЕ ПРОСТРАНСТВО</div>
<nav class="nav" id="nav">
<button class="active" data-page="dashboard">⌂ Обзор</button>
<button data-page="manuscript">✎ Рукопись</button>
<button data-page="chapters">☷ Главы</button>
<button data-page="notes">✧ Заметки</button>
<button data-page="characters">♙ Персонажи</button>
<button data-page="world">⌘ Мир и лор</button>
<button data-page="details">▤ Паспорт книги</button>
</nav>
<div class="muted small">МОИ ПРОЕКТЫ</div><div class="project-list" id="projectList"></div>
<div class="side-bottom">
<button id="exportAll">⇩ Экспорт всех проектов</button>
<button id="importAll">⇧ Импорт резервной копии</button>
<div class="muted small">Данные хранятся на этом устройстве.</div>
</div>
</aside>
<main class="main"><div class="page">
<header class="topbar"><div style="display:flex;align-items:center;gap:10px"><button class="mobile-menu" id="menuBtn">☰</button><h1 id="pageTitle">Твоя мастерская</h1></div><div class="actions"><span class="pill" id="saveStatus">● Автосохранение</span><button id="quickExport">Экспорт</button></div></header>
<section id="content"></section>
</div></main>
</div>
<div class="toast" id="toast"></div><input type="file" id="filePicker" accept="image/*,.json,.txt,.md" class="hidden">
<script>
const KEY='ink_story_v1';
const $=s=>document.querySelector(s);
const uid=()=>Math.random().toString(36).slice(2,10);
const blankProject=(name='Новая история')=>({id:uid(),name,cover:'',genre:'',status:'В работе',logline:'',annotation:'',synopsis:'',author:'',world:'',tags:[],chapters:[],notes:[],characters:[],manuscript:'',created:Date.now(),updated:Date.now()});
let state={projects:[],active:null,page:'dashboard'};
function load(){try{const x=JSON.parse(localStorage.getItem(KEY));if(x&&Array.isArray(x.projects))state=x}catch(e){}if(!state.projects.length){let p=blankProject('Моя первая книга');state.projects=[p];state.active=p.id}if(!state.active||!state.projects.find(p=>p.id===state.active))state.active=state.projects[0].id}
const project=()=>state.projects.find(p=>p.id===state.active);
function save(){const p=project();if(p)p.updated=Date.now();localStorage.setItem(KEY,JSON.stringify(state));$('#saveStatus').textContent='● Сохранено';}
let saveTimer;function autosave(){ $('#saveStatus').textContent='● Сохраняю…';clearTimeout(saveTimer);saveTimer=setTimeout(save,350)}
function toast(t){const el=$('#toast');el.textContent=t;el.classList.add('show');setTimeout(()=>el.classList.remove('show'),2100)}
function esc(s=''){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function setPage(page){state.page=page;$('#sidebar').classList.remove('open');render()}
function render(){const p=project();$('#pageTitle').textContent=({dashboard:'Твоя мастерская',manuscript:'Рукопись',chapters:'Главы и сцены',notes:'Заметки',characters:'Персонажи',world:'Мир и лор',details:'Паспорт книги'})[state.page]||'Твоя мастерская';document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===state.page));$('#projectList').innerHTML=state.projects.map(x=>`<button class="project-item ${x.id===state.active?'active':''}" data-project="${x.id}">📖 <span>${esc(x.name)}</span></button>`).join('');$('#content').innerHTML=views[state.page](p);bindCommon()}
const views={
dashboard:p=>{let words=(p.manuscript||'').replace(/<[^>]*>/g,' ').trim().split(/\s+/).filter(Boolean).length;return `<div class="grid">
<div class="card" style="grid-column:span 12"><div class="cover-row"><div>${p.cover?`<img class="cover" src="${p.cover}">`:`<div class="cover-placeholder">Обложка<br>пока не добавлена</div>`}<button style="width:100%;margin-top:8px" data-action="cover">＋ Обложка</button></div><div><div class="pill">${esc(p.status)}</div><h2 style="font-size:29px;margin:10px 0">${esc(p.name)}</h2><p class="muted">${esc(p.logline||'Добавь короткий слоган или идею своей книги.')}</p><div class="stats"><div class="stat"><b>${words.toLocaleString('ru-RU')}</b><small>слов в рукописи</small></div><div class="stat"><b>${p.chapters.length}</b><small>глав</small></div><div class="stat"><b>${p.characters.length}</b><small>персонажей</small></div><div class="stat"><b>${p.notes.length}</b><small>заметок</small></div></div><div class="actions" style="margin-top:16px"><button class="primary" data-go="manuscript">Продолжить писать →</button><button data-go="details">Паспорт книги</button></div></div></div></div>
<div class="card" style="grid-column:span 7"><h2>Аннотация</h2><p>${esc(p.annotation||'Здесь появится аннотация. Добавь её в паспорте книги.')}</p></div>
<div class="card" style="grid-column:span 5"><h2>Быстрые заметки</h2>${p.notes.slice(0,3).map(n=>`<div class="note-row"><span>${esc(n.title)}</span><span class="pill">${esc(n.type||'Идея')}</span></div>`).join('')||'<div class="muted">Пока пусто — сохрани первую идею.</div>'}<button style="margin-top:10px" data-go="notes">Все заметки →</button></div></div>`},
manuscript:p=>`<div class="actions" style="margin-bottom:10px"><button data-cmd="bold"><b>B</b></button><button data-cmd="italic"><i>I</i></button><button data-cmd="formatBlock" data-value="h2">Заголовок</button><button data-cmd="formatBlock" data-value="blockquote">Цитата</button><button data-cmd="insertHorizontalRule">Разделитель</button><button data-action="insertImage">＋ Картинка</button><button data-action="wordGoal">Цель слов</button><span class="toolbar-spacer"></span><span class="pill" id="wordCount">Подсчёт слов</span></div><div class="editor-wrap"><div class="editor-toolbar"><span class="small" style="color:#655c66;padding:5px">ТВОЯ РУКОПИСЬ · изменения сохраняются автоматически</span></div><div class="editor" id="editor" contenteditable="true" spellcheck="true">${p.manuscript||''}</div></div><p class="muted small">Совет: нажми «＋ Картинка», чтобы добавить иллюстрацию прямо в текст. Для переноса рукописи используй экспорт проекта.</p>`,
chapters:p=>`<div class="card"><div class="actions" style="justify-content:space-between"><h2>Структура книги</h2><button class="primary" data-action="addChapter">＋ Добавить главу</button></div>${p.chapters.length?p.chapters.map((c,i)=>`<div class="chapter-row"><div><b>${i+1}. ${esc(c.title)}</b><div class="muted small">${esc(c.summary||'Без описания')} · ${c.words||0} слов</div></div><div class="actions"><button data-edit-chapter="${c.id}">Изменить</button><button class="danger" data-delete-chapter="${c.id}">×</button></div></div>`).join(''):'<div class="empty">Пока нет глав. Создай первую и начни выстраивать сюжет.</div>'}</div>`,
notes:p=>`<div class="card"><div class="actions" style="justify-content:space-between"><h2>Блокнот идей</h2><button class="primary" data-action="addNote">＋ Новая заметка</button></div>${p.notes.length?p.notes.map(n=>`<div class="note-row"><div><b>${esc(n.title)}</b><div class="muted small">${esc(n.type||'Идея')} · ${esc(n.body||'')}</div></div><div class="actions"><button data-edit-note="${n.id}">Открыть</button><button class="danger" data-delete-note="${n.id}">×</button></div></div>`).join(''):'<div class="empty">Сюда можно складывать диалоги, сюжетные повороты, случайные мысли и сцены.</div>'}</div>`,
characters:p=>`<div class="card"><div class="actions" style="justify-content:space-between"><h2>Действующие лица</h2><button class="primary" data-action="addCharacter">＋ Персонаж</button></div><div class="grid">${p.characters.map(c=>`<div class="card" style="grid-column:span 6;background:var(--panel2)"><div style="display:flex;gap:12px">${c.photo?`<img src="${c.photo}" style="width:76px;height:96px;object-fit:cover;border-radius:9px">`:'<div class="cover-placeholder" style="width:76px;aspect-ratio:3/4">Фото</div>'}<div><b>${esc(c.name)}</b><div class="muted small">${esc(c.role||'Персонаж')}</div><p class="small">${esc(c.description||'')}</p><button data-edit-character="${c.id}">Анкета</button> <button class="danger" data-delete-character="${c.id}">×</button></div></div></div>`).join('')}</div>${p.characters.length?'':'<div class="empty">Создай анкету героя: внешность, характер, цели, секреты и отношения.</div>'}</div>`,
world:p=>`<div class="card"><h2>Мир и лор</h2><p class="muted">Правила мира, география, история, магия, организации, технологии — всё, что важно не забыть.</p><div class="field"><label>Заметки о мире</label><textarea id="worldText" rows="18" placeholder="Устройство мира, страны, города, исторические события...">${esc(p.world)}</textarea></div><button class="primary" data-action="saveWorld">Сохранить</button></div>`,
details:p=>`<div class="grid"><div class="card" style="grid-column:span 12"><h2>Паспорт книги</h2><div class="grid"><div class="field" style="grid-column:span 6"><label>Название</label><input id="dName" value="${esc(p.name)}"></div><div class="field" style="grid-column:span 3"><label>Жанр</label><input id="dGenre" value="${esc(p.genre)}" placeholder="Фэнтези, детектив..."></div><div class="field" style="grid-column:span 3"><label>Статус</label><select id="dStatus">${['В работе','Планируется','На паузе','Завершено'].map(x=>`<option ${p.status===x?'selected':''}>${x}</option>`).join('')}</select></div><div class="field" style="grid-column:span 6"><label>Автор</label><input id="dAuthor" value="${esc(p.author)}" placeholder="Псевдоним или имя"></div><div class="field" style="grid-column:span 6"><label>Слоган / логлайн</label><input id="dLogline" value="${esc(p.logline)}" placeholder="Одна фраза о сути истории"></div><div class="field" style="grid-column:span 12"><label>Аннотация</label><textarea id="dAnnotation" rows="5" placeholder="Текст для задней стороны обложки...">${esc(p.annotation)}</textarea></div><div class="field" style="grid-column:span 12"><label>Краткий синопсис (для себя)</label><textarea id="dSynopsis" rows="6">${esc(p.synopsis)}</textarea></div></div><button class="primary" data-action="saveDetails">Сохранить паспорт</button></div><div class="card" style="grid-column:span 12"><h2>Обложка</h2><p class="muted">Добавь изображение обложки. Оно останется в проекте и попадёт в резервную копию.</p><button data-action="cover">Выбрать изображение</button> <button class="danger" data-action="removeCover">Удалить обложку</button></div></div>`
};
function bindCommon(){
$('#projectList').querySelectorAll('[data-project]').forEach(b=>b.onclick=()=>{state.active=b.dataset.project;save();render()});
$('#nav').querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>setPage(b.dataset.page));
document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>setPage(b.dataset.go));
document.querySelectorAll('[data-action]').forEach(b=>b.onclick=()=>actions[b.dataset.action]?.());
document.querySelectorAll('[data-cmd]').forEach(b=>b.onclick=()=>{document.execCommand(b.dataset.cmd,false,b.dataset.value||null);$('#editor')?.focus()});
const ed=$('#editor');if(ed){ed.oninput=()=>{project().manuscript=ed.innerHTML;autosave();countWords()};countWords()}
}
function countWords(){let t=$('#editor')?.innerText||'';let n=t.trim()?t.trim().split(/\s+/).length:0;$('#wordCount').textContent=n+' слов'}
function modal(title,body,saveLabel,fn){const wrap=document.createElement('div');wrap.className='modal-back';wrap.innerHTML=`<div class="modal"><div class="actions" style="justify-content:space-between"><h2>${title}</h2><button data-close>✕</button></div>${body}<div class="actions" style="justify-content:flex-end;margin-top:16px"><button data-close>Отмена</button><button class="primary" data-save>${saveLabel}</button></div></div>`;document.body.append(wrap);wrap.querySelectorAll('[data-close]').forEach(b=>b.onclick=()=>wrap.remove());wrap.querySelector('[data-save]').onclick=()=>{fn(wrap);wrap.remove();save();render()};return wrap}
function pickImage(cb){const f=$('#filePicker');f.accept='image/*';f.onchange=()=>{let file=f.files[0];if(!file)return;let r=new FileReader();r.onload=()=>{cb(r.result);save();render()};r.readAsDataURL(file);f.value=''};f.click()}
const actions={
cover:()=>pickImage(data=>project().cover=data),
removeCover:()=>{project().cover='';save();render()},
insertImage:()=>pickImage(data=>{let ed=$('#editor');ed.focus();document.execCommand('insertImage',false,data);project().manuscript=ed.innerHTML;autosave()}),
addChapter:()=>chapterModal(),
addNote:()=>noteModal(),
addCharacter:()=>characterModal(),
saveWorld:()=>{project().world=$('#worldText').value;save();toast('Лор сохранён')},
saveDetails:()=>{let p=project();p.name=$('#dName').value||'Без названия';p.genre=$('#dGenre').value;p.status=$('#dStatus').value;p.author=$('#dAuthor').value;p.logline=$('#dLogline').value;p.annotation=$('#dAnnotation').value;p.synopsis=$('#dSynopsis').value;save();render();toast('Паспорт сохранён')},
wordGoal:()=>{let n=prompt('Сколько слов — твоя цель на сегодня?','1000');if(n)toast('Твоя цель: '+n+' слов. У тебя получится!')}
};
function chapterModal(c){let edit=!!c; c=c||{title:'',summary:'',words:0,id:uid()};let m=modal(edit?'Редактировать главу':'Новая глава',`<div class="field"><label>Название главы</label><input id="ct" value="${esc(c.title)}"></div><div class="field"><label>Краткое содержание</label><textarea id="cs">${esc(c.summary)}</textarea></div><div class="field"><label>Планируемый объём (слов)</label><input id="cw" type="number" value="${c.words||0}"></div>`,'Сохранить',w=>{c.title=w.querySelector('#ct').value||'Без названия';c.summary=w.querySelector('#cs').value;c.words=+w.querySelector('#cw').value||0;if(!edit)project().chapters.push(c)});}
function noteModal(n){let edit=!!n;n=n||{id:uid(),title:'',type:'Идея',body:''};let m=modal(edit?'Заметка':'Новая заметка',`<div class="field"><label>Заголовок</label><input id="nt" value="${esc(n.title)}"></div><div class="field"><label>Тип</label><select id="ny">${['Идея','Сцена','Диалог','Сюжетный поворот','Исследование','Другое'].map(x=>`<option ${n.type===x?'selected':''}>${x}</option>`).join('')}</select></div><div class="field"><label>Текст</label><textarea id="nb" rows="7">${esc(n.body)}</textarea></div>`,'Сохранить',w=>{n.title=w.querySelector('#nt').value||'Без названия';n.type=w.querySelector('#ny').value;n.body=w.querySelector('#nb').value;if(!edit)project().notes.unshift(n)});}
function characterModal(c){let edit=!!c;c=c||{id:uid(),name:'',role:'',age:'',appearance:'',personality:'',goal:'',secret:'',relations:'',description:'',photo:''};let m=modal(edit?'Анкета персонажа':'Новый персонаж',`<div class="field"><label>Имя</label><input id="cn" value="${esc(c.name)}"></div><div class="field"><label>Роль в истории</label><input id="cr" value="${esc(c.role)}" placeholder="Главный герой, антагонист..."></div><div class="field"><label>Возраст</label><input id="ca" value="${esc(c.age)}"></div><div class="field"><label>Внешность</label><textarea id="cap">${esc(c.appearance)}</textarea></div><div class="field"><label>Характер</label><textarea id="cper">${esc(c.personality)}</textarea></div><div class="field"><label>Цель и мотивация</label><textarea id="cgoal">${esc(c.goal)}</textarea></div><div class="field"><label>Секреты и страхи</label><textarea id="csec">${esc(c.secret)}</textarea></div><div class="field"><label>Связи с другими героями</label><textarea id="crel">${esc(c.relations)}</textarea></div><div class="field"><label>Короткое описание для карточки</label><textarea id="cdesc">${esc(c.description)}</textarea></div><div class="field"><label>Фото персонажа</label><button type="button" id="cphoto">Выбрать фото</button><span class="small muted">${c.photo?'Фото добавлено':'Фото не выбрано'}</span></div>`,'Сохранить',w=>{Object.assign(c,{name:w.querySelector('#cn').value||'Безымянный персонаж',role:w.querySelector('#cr').value,age:w.querySelector('#ca').value,appearance:w.querySelector('#cap').value,personality:w.querySelector('#cper').value,goal:w.querySelector('#cgoal').value,secret:w.querySelector('#csec').value,relations:w.querySelector('#crel').value,description:w.querySelector('#cdesc').value});if(!edit)project().characters.push(c)});m.querySelector('#cphoto').onclick=()=>pickImage(data=>{c.photo=data;m.querySelector('#cphoto').textContent='Фото выбрано ✓'});}
function download(name,data,type='application/json'){let a=document.createElement('a'),url=URL.createObjectURL(new Blob([data],{type}));a.href=url;a.download=name;a.click();URL.revokeObjectURL(url)}
function exportProject(){let p=project();download((p.name||'project').replace(/[^\p{L}\p{N}_-]/gu,'_')+'.json',JSON.stringify(p,null,2))}
function exportAll(){download('ink-story-backup.json',JSON.stringify(state,null,2))}
function importBackup(){let f=$('#filePicker');f.accept='.json,application/json';f.onchange=()=>{let file=f.files[0];if(!file)return;let r=new FileReader();r.onload=()=>{try{let data=JSON.parse(r.result);if(data.projects){state=data}else if(data.id){state.projects.push(data);state.active=data.id}else throw 0;save();render();toast('Резервная копия импортирована')}catch(e){alert('Не удалось прочитать JSON-файл.')} };r.readAsText(file);f.value=''}}
function bindDeletes(){document.querySelectorAll('[data-delete-chapter]').forEach(b=>b.onclick=()=>{if(confirm('Удалить главу?')){project().chapters=project().chapters.filter(x=>x.id!==b.dataset.deleteChapter);save();render()}});document.querySelectorAll('[data-edit-chapter]').forEach(b=>b.onclick=()=>chapterModal(project().chapters.find(x=>x.id===b.dataset.editChapter)));document.querySelectorAll('[data-delete-note]').forEach(b=>b.onclick=()=>{project().notes=project().notes.filter(x=>x.id!==b.dataset.deleteNote);save();render()});document.querySelectorAll('[data-edit-note]').forEach(b=>b.onclick=()=>noteModal(project().notes.find(x=>x.id===b.dataset.editNote)));document.querySelectorAll('[data-delete-character]').forEach(b=>b.onclick=()=>{project().characters=project().characters.filter(x=>x.id!==b.dataset.deleteCharacter);save();render()});document.querySelectorAll('[data-edit-character]').forEach(b=>b.onclick=()=>characterModal(project().characters.find(x=>x.id===b.dataset.editCharacter)))}
const oldRender=render;render=function(){oldRender();bindDeletes()};
$('#newProject').onclick=()=>{let name=prompt('Как назовём новую историю?','Новая история');if(name){let p=blankProject(name);state.projects.push(p);state.active=p.id;save();render()}};
$('#exportAll').onclick=exportAll;$('#quickExport').onclick=exportProject;$('#importAll').onclick=importBackup;$('#menuBtn').onclick=()=>$('#sidebar').classList.toggle('open');
load();render();
if('serviceWorker' in navigator && location.protocol.startsWith('http'))navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script></body></html>
